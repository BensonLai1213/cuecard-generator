<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手卡排版器 (A4八宮格 - 字元級切割與右側全編輯版)</title>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --panel-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #1e293b;
            --a4-width: 210mm;
            --a4-height: 297mm;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Helvetica Neue", Helvetica, "PingFang TC", "LiHei Pro", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: grid;
            grid-template-columns: 543px 8px 1fr;
            height: 100vh;
        }

        .resizer {
            background-color: #cbd5e1;
            cursor: col-resize;
            transition: background-color 0.2s;
            z-index: 10;
        }

        .resizer:hover, .resizer:active { background-color: #64748b; }

        /* 左側編輯區 */
        .editor-panel {
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow: hidden;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .font-control {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        textarea {
            flex-grow: 1;
            resize: none;
            padding: 15px;
            font-size: 16px;
            line-height: 1.6;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
            font-family: inherit;
        }

        textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        button.primary-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        button.primary-btn:hover { background-color: #2563eb; }

        .tips-box {
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 15px;
            font-size: 13px;
            color: #1e3a8a;
            flex-shrink: 0;
        }
        .tips-box p { margin-bottom: 6px; font-size: 14px; }
        .tips-box ul { padding-left: 20px; display: flex; flex-direction: column; gap: 6px; margin: 0; }
        .tips-box code { background: #dbeafe; padding: 2px 4px; border-radius: 4px; font-family: monospace; }

        /* 右側預覽區 */
        .preview-panel {
            padding: 30px;
            overflow-y: auto;
            background-color: #94a3b8;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .a4-page {
            width: var(--a4-width);
            height: var(--a4-height);
            background-color: white;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: repeat(4, 1fr);
            flex-shrink: 0;
            padding: 0; 
        }

        .cue-card {
            border-right: 1px dashed #cbd5e1;
            border-bottom: 1px dashed #cbd5e1;
            padding: 8mm; 
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .cue-card:nth-child(2n) { border-right: none; }
        .cue-card:nth-child(7), .cue-card:nth-child(8) { border-bottom: none; }

        /* 單張卡片字體微調工具列 */
        .card-toolbar {
            position: absolute;
            top: 5px;
            right: 5px;
            display: none;
            gap: 4px;
            background: rgba(255, 255, 255, 0.9);
            padding: 4px;
            border-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
            z-index: 5;
        }
        .cue-card:hover .card-toolbar {
            display: flex;
        }
        .card-toolbar button {
            background-color: #f1f5f9;
            border: 1px solid #cbd5e1;
            color: #333;
            cursor: pointer;
            padding: 2px 6px;
            font-size: 12px;
            border-radius: 3px;
        }
        .card-toolbar button:hover { background-color: #e2e8f0; }

        .card-content {
            flex-grow: 1;
            overflow: hidden;
            line-height: 1.4; 
            outline: none; 
            word-break: break-all; /* 允許中文字元精準斷行 */
        }

        .card-content[contenteditable="true"]:focus {
            background-color: rgba(255, 255, 255, 0.6);
            box-shadow: inset 0 0 0 2px #3b82f6;
            border-radius: 4px;
        }

        .card-footer {
            text-align: right;
            font-size: 10px;
            color: #94a3b8;
            margin-top: auto;
            padding-top: 5px;
            user-select: none;
        }

        /* 列印專用樣式 */
        @media print {
            @page { size: A4 portrait; margin: 0; }
            body { background: none; }
            .container { display: block; height: auto; overflow: visible; }
            .editor-panel, .resizer, .tips-box, .card-toolbar { display: none !important; }
            .preview-panel { padding: 0; background: none; gap: 0; overflow: visible; display: block; }
            .a4-page { box-shadow: none; page-break-after: always; }
        }
    </style>
</head>
<body>
    <div class="container" id="main-container">
        <!-- 左側編輯區 -->
        <div class="editor-panel">
            <div class="toolbar">
                <div class="font-control">
                    <label for="fontSizeSlider">基礎字級：<span id="fontSizeDisplay">24</span>px</label>
                    <input type="range" id="fontSizeSlider" min="16" max="36" value="24">
                </div>
                <button class="primary-btn" onclick="window.print()">列印 / 匯出 PDF</button>
            </div>
            
            <div class="tips-box">
                <p><strong>💡 使用者小撇步</strong></p>
                <ul>
                    <li>●程序名稱、［程序名稱］或 【單元名稱】，開頭的段落，會自動強制換一張新手卡。</li>
                    <li>右側預覽區的卡片可以直接點擊修改文字，修改內容會自動同步回左側輸入框。</li>
                    <li>點擊「列印 / 匯出 PDF」後會生成輔助裁切線，印出後十字對齊裁切即可。</li>
                </ul>
            </div>

            <textarea id="scriptInput" placeholder="請貼上講稿...">【原田會長賀詞】
主持人A：大家好，首先為大家帶來原田會長的賀詞！

［注意事項、題目三唱］
司儀：大家(早/午/晚)安，歡迎大家前來參加○○地區友好總會！精彩節目即將開始，兩點注意事項在此提醒大家：
1. 為使程序順利進行，請將手機調至震動或關機。
2. 拍照時，請勿影響他人與程序進行。拍攝之照片或影片欲上傳，未經同意不可上傳含有可辨識當事人之照片。
首先請___(職稱)___(姓名)帶領我們題目三唱。</textarea>
        </div>

        <!-- 中間拖曳調整桿 -->
        <div class="resizer" id="resizer"></div>

        <!-- 右側預覽區 -->
        <div class="preview-panel" id="previewContainer"></div>
    </div>

    <script>
        const inputArea = document.getElementById('scriptInput');
        const previewContainer = document.getElementById('previewContainer');
        const fontSizeSlider = document.getElementById('fontSizeSlider');
        const fontSizeDisplay = document.getElementById('fontSizeDisplay');
        const mainContainer = document.getElementById('main-container');
        const resizer = document.getElementById('resizer');

        // ==== 面板寬度拖曳邏輯 ====
        let isResizing = false;
        resizer.addEventListener('mousedown', (e) => {
            isResizing = true;
            document.body.style.cursor = 'col-resize';
            e.preventDefault(); 
        });
        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            const containerRect = mainContainer.getBoundingClientRect();
            let newLeftWidth = e.clientX - containerRect.left;
            if (newLeftWidth < 200) newLeftWidth = 200;
            if (newLeftWidth > containerRect.width - 300) newLeftWidth = containerRect.width - 300;
            mainContainer.style.gridTemplateColumns = `${newLeftWidth}px 8px 1fr`;
        });
        document.addEventListener('mouseup', () => {
            if (isResizing) {
                isResizing = false;
                document.body.style.cursor = 'default';
            }
        });

        // ==== 排版狀態管理 ====
        let baseFontSize = 24;
        let customFontSizes = {}; // 紀錄每張卡片專屬的字體大小

        fontSizeSlider.addEventListener('input', () => {
            baseFontSize = parseInt(fontSizeSlider.value);
            fontSizeDisplay.textContent = baseFontSize;
            // 清除個別覆寫設定，統一字體
            customFontSizes = {};
            renderCards();
        });

        inputArea.addEventListener('input', () => renderCards());

        // ==== DOM 文字與游標輔助函式 ====
        
        // 取得單一 DOM 節點下的純文字長度 (包含將 <br> 視為 \n, 長度為 1)
        function getElementTextLength(element) {
            let len = 0;
            function traverse(n) {
                if (n.nodeType === 3) len += n.textContent.length;
                else if (n.nodeName === 'BR') len += 1;
                else for (let child of n.childNodes) traverse(child);
            }
            traverse(element);
            return len;
        }

        // 遞迴提取卡片內的純文字
        function extractText(element) {
            let res = '';
            if (element.nodeType === 3) res += element.textContent;
            else if (element.nodeName === 'BR') res += '\n';
            else for (let child of element.childNodes) res += extractText(child);
            return res;
        }

        // 計算 Selection 在指定卡片內的絕對 Offset
        function getCursorOffsetInCard(card) {
            let sel = window.getSelection();
            if (!sel.rangeCount) return 0;
            let range = sel.getRangeAt(0);
            let offset = 0;
            let found = false;
            
            function traverse(n) {
                if (found) return;
                if (n === range.startContainer) {
                    if (n.nodeType === 3) {
                        offset += range.startOffset;
                    } else {
                        for (let i = 0; i < range.startOffset; i++) {
                            offset += getElementTextLength(n.childNodes[i]);
                        }
                    }
                    found = true;
                    return;
                }
                if (n.nodeType === 3) offset += n.textContent.length;
                else if (n.nodeName === 'BR') offset += 1;
                else for (let child of n.childNodes) traverse(child);
            }
            traverse(card);
            return offset;
        }

        // 在指定卡片的特定絕對 Offset 處放置游標
        function setCursorInCard(card, targetOffset) {
            let currentLen = 0;
            let range = document.createRange();
            let sel = window.getSelection();
            let set = false;

            function traverse(n) {
                if (set) return;
                if (n.nodeType === 3) {
                    let nodeLen = n.textContent.length;
                    if (targetOffset <= currentLen + nodeLen) {
                        range.setStart(n, targetOffset - currentLen);
                        range.collapse(true);
                        set = true;
                    }
                    currentLen += nodeLen;
                } else if (n.nodeName === 'BR') {
                    if (targetOffset === currentLen) {
                        range.setStartBefore(n);
                        range.collapse(true);
                        set = true;
                    } else if (targetOffset === currentLen + 1) {
                        range.setStartAfter(n);
                        range.collapse(true);
                        set = true;
                    }
                    currentLen += 1;
                } else {
                    for (let child of n.childNodes) traverse(child);
                }
            }
            traverse(card);
            
            sel.removeAllRanges();
            if (set) {
                sel.addRange(range);
            } else {
                range.selectNodeContents(card);
                range.collapse(false);
                sel.addRange(range);
            }
        }

        // 偵測是否溢位
        function isOverflow(element) {
            return element.scrollHeight > element.clientHeight;
        }

        // ==== 排版核心演算法 (字元級二元搜尋) ====
        function renderCards(cursorGlobalPos = null) {
            const text = inputArea.value;
            const lines = text.split('\n');
            
            previewContainer.innerHTML = '';
            
            let cardIndex = 0;
            let currentPage = null;
            let cardsOnPage = 0;

            function createA4Page() {
                const page = document.createElement('div');
                page.className = 'a4-page';
                previewContainer.appendChild(page);
                return page;
            }

            function createNewCard() {
                if (cardsOnPage >= 8 || !currentPage) {
                    currentPage = createA4Page();
                    cardsOnPage = 0;
                }
                cardIndex++;
                const card = document.createElement('div');
                card.className = 'cue-card';
                
                // 專屬字體微調工具列
                const toolbar = document.createElement('div');
                toolbar.className = 'card-toolbar';
                toolbar.contentEditable = "false";
                const btnPlus = document.createElement('button');
                btnPlus.textContent = 'A+';
                btnPlus.onmousedown = (e) => { e.preventDefault(); }; // 避免搶走游標
                btnPlus.onclick = () => { 
                    customFontSizes[cardIndex] = (customFontSizes[cardIndex] || baseFontSize) + 2; 
                    renderCards(); 
                };
                const btnMinus = document.createElement('button');
                btnMinus.textContent = 'A-';
                btnMinus.onmousedown = (e) => { e.preventDefault(); };
                btnMinus.onclick = () => { 
                    customFontSizes[cardIndex] = Math.max(12, (customFontSizes[cardIndex] || baseFontSize) - 2); 
                    renderCards(); 
                };
                toolbar.appendChild(btnPlus);
                toolbar.appendChild(btnMinus);
                
                const content = document.createElement('div');
                content.className = 'card-content';
                content.contentEditable = "true";
                content.spellcheck = false;
                content.style.fontSize = (customFontSizes[cardIndex] || baseFontSize) + 'px';
                
                const footer = document.createElement('div');
                footer.className = 'card-footer';
                footer.contentEditable = "false";
                footer.textContent = `Card ${cardIndex}`;

                card.appendChild(toolbar);
                card.appendChild(content);
                card.appendChild(footer);
                currentPage.appendChild(card);
                cardsOnPage++;
                
                return content;
            }

            let currentCard = createNewCard();

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i];
                let isForceBreak = /^([●【［\[])/.test(line.trim());

                // 遇到強制換頁標記，且當前卡片已有內容時，開新卡
                if (isForceBreak && getElementTextLength(currentCard) > 0) {
                    currentCard = createNewCard();
                }

                if (line === '') {
                    currentCard.appendChild(document.createElement('br'));
                    // 若這行空行導致溢出，直接把空行移到下一頁
                    if (isOverflow(currentCard)) {
                        currentCard.lastChild.remove();
                        currentCard = createNewCard();
                        currentCard.appendChild(document.createElement('br'));
                    }
                } else {
                    let remain = line;
                    while (remain.length > 0) {
                        let low = 1, high = remain.length, fitCount = 0;
                        let testNode = document.createTextNode('');
                        currentCard.appendChild(testNode);

                        // 二元搜尋：尋找能在這張卡片塞下的最大字數
                        while (low <= high) {
                            let mid = Math.floor((low + high) / 2);
                            testNode.textContent = remain.substring(0, mid);
                            if (!isOverflow(currentCard)) {
                                fitCount = mid;
                                low = mid + 1; // 嘗試塞更多字
                            } else {
                                high = mid - 1; // 塞不下，字數減少
                            }
                        }
                        
                        if (fitCount === 0) {
                            // 連一個字都塞不下
                            testNode.remove();
                            // 如果卡片本來是空的卻塞不下一個字 (字體過大)，強迫塞入以防無窮迴圈
                            if (getElementTextLength(currentCard) === 0) {
                                currentCard.appendChild(document.createTextNode(remain[0]));
                                remain = remain.substring(1);
                            }
                            currentCard = createNewCard();
                        } else {
                            testNode.textContent = remain.substring(0, fitCount);
                            remain = remain.substring(fitCount);
                            if (remain.length > 0) {
                                currentCard = createNewCard();
                            }
                        }
                    }
                }

                // 補上段落結尾的換行 (除非是最後一段)
                if (i < lines.length - 1) {
                    currentCard.appendChild(document.createElement('br'));
                    if (isOverflow(currentCard)) {
                        currentCard.lastChild.remove();
                        currentCard = createNewCard();
                    }
                }
            }

            // 補齊最後一頁 A4 剩餘的空格（印出裁切線所需）
            while (cardsOnPage > 0 && cardsOnPage < 8) {
                const emptyCard = document.createElement('div');
                emptyCard.className = 'cue-card';
                currentPage.appendChild(emptyCard);
                cardsOnPage++;
            }

            // ==== 還原游標位置 ====
            if (cursorGlobalPos !== null) {
                let cards = document.querySelectorAll('.card-content');
                let currentLen = 0;
                for (let card of cards) {
                    let cardLen = getElementTextLength(card);
                    if (cursorGlobalPos <= currentLen + cardLen) {
                        setCursorInCard(card, cursorGlobalPos - currentLen);
                        card.focus();
                        return;
                    }
                    currentLen += cardLen;
                }
            }
        }

        // ==== 雙向編輯即時同步 ====
        previewContainer.addEventListener('input', (e) => {
            if (e.target.classList.contains('card-content')) {
                let cards = document.querySelectorAll('.card-content');
                let fullText = '';
                let globalCursorPos = 0;

                // 找尋當下游標位置對應的絕對字元位置
                let sel = window.getSelection();
                let activeCard = (sel.rangeCount > 0 && sel.anchorNode) 
                    ? (sel.anchorNode.nodeType === 3 ? sel.anchorNode.parentNode.closest('.card-content') : sel.anchorNode.closest('.card-content'))
                    : null;

                for (let card of cards) {
                    if (card === activeCard) {
                        globalCursorPos = fullText.length + getCursorOffsetInCard(card);
                    }
                    fullText += extractText(card);
                }

                inputArea.value = fullText;
                
                // 只有當前卡片溢出時才強制重繪，以節省效能；
                // 由於我們改用字元級精準切割，只要溢位一發生，就會立刻推移後方版面並還原游標。
                if (isOverflow(e.target) || e.inputType.includes('delete')) {
                    renderCards(globalCursorPos);
                }
            }
        });

        // ==== 首行 Backspace 跳轉前卡 ====
        previewContainer.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace') {
                let sel = window.getSelection();
                if (!sel.isCollapsed) return; // 反白刪除時不干涉

                let activeCard = e.target.closest('.card-content');
                if (!activeCard) return;

                let offset = getCursorOffsetInCard(activeCard);
                if (offset === 0) {
                    // 若在該卡片第一個字按下 Backspace，跳轉至上一張卡片結尾
                    let cards = Array.from(document.querySelectorAll('.card-content'));
                    let activeIndex = cards.indexOf(activeCard);
                    if (activeIndex > 0) {
                        e.preventDefault(); // 阻止刪除行為
                        let prevCard = cards[activeIndex - 1];
                        let prevLen = getElementTextLength(prevCard);
                        prevCard.focus();
                        setCursorInCard(prevCard, prevLen);
                    }
                }
            }
        });

        // 初次渲染
        renderCards();
    </script>
</body>
</html>
